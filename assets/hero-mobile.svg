<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
<title id="title">João Vitor Gonçalves</title><desc id="desc">Desenvolvimento full-stack com JavaScript, Node.js e React. Tipografia animada e símbolo do React em rotação.</desc>
<defs>
<radialGradient id="light"><stop stop-color="#174451"/><stop offset="1" stop-color="#0c111b"/></radialGradient>
<linearGradient id="beam"><stop stop-color="#46bdda" stop-opacity="0"/><stop offset=".5" stop-color="#46bdda" stop-opacity=".4"/><stop offset="1" stop-color="#46bdda" stop-opacity="0"/></linearGradient>
<clipPath id="bounds"><rect width="600" height="430" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Trebuchet MS',Verdana,sans-serif}
.name{fill:#eef5fb;font-weight:700;letter-spacing:-2px}
.word{animation:split 1.2s cubic-bezier(.16,1,.3,1) both}.second{animation-delay:.12s}
.react{transform-box:fill-box;transform-origin:center;animation:orbit 28s linear infinite}
.beam{animation:drift 12s ease-in-out infinite alternate}
.beam2{animation:drift 16s ease-in-out infinite alternate-reverse}
@keyframes split{from{opacity:.25;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-90px);opacity:.25}to{transform:translateX(85px);opacity:.8}}
@media(prefers-reduced-motion:reduce){.word,.react,.beam,.beam2{animation:none}}
</style>
<g clip-path="url(#bounds)">
<rect width="600" height="430" fill="#0c111b"/>
<ellipse cx="480" cy="95" rx="290" ry="310" fill="url(#light)"/>
<g fill="none" stroke="url(#beam)" stroke-width="36" transform="rotate(27 480 95)">
<path class="beam" d="M340 -250V750"/><path class="beam2" d="M565 -250V750"/>
</g>
<circle cx="480" cy="95" r="83" fill="none" stroke="#25404b"/>
<circle cx="480" cy="95" r="103" fill="none" stroke="#1a2b38" stroke-dasharray="3 14"/>
