<svg xmlns="http://www.w3.org/2000/svg" width="100" height="116" viewBox="0 0 100 116" role="img" aria-labelledby="title"><title id="title">CSS3</title>
<style>
.tile{fill:#101a29;stroke:#26374b}.label{font:13px Verdana,sans-serif;fill:#d7e4f2}
.mark{transform-box:fill-box;transform-origin:center;animation:float 4.5s ease-in-out infinite;animation-delay:-0s}

.edge{fill:none;stroke:#58a6ff;stroke-width:1.4;stroke-dasharray:20 285;animation:edge 8s linear infinite;opacity:.65}
@keyframes float{0%,100%{transform:translateY(2px) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes edge{to{stroke-dashoffset:-305}}
@media(prefers-reduced-motion:reduce){.mark,.edge{animation:none}}
</style>
<rect class="tile" x="5" y="5" width="90" height="105" rx="15"/>
<rect class="edge" x="5" y="5" width="90" height="105" rx="15"/>
